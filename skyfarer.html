<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESA SkyMed Demonstration Project — Haayed Aslam</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-300">

<!-- NAV -->
<header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-50 border-b border-gray-200 dark:border-gray-700">
    <div class="max-w-3xl mx-auto flex items-center justify-between px-6 py-4">
        <a href="index.html" class="flex items-center gap-2 text-sm font-semibold text-gray-600 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            Back
        </a>
        <button id="darkToggle" class="px-3 py-1 rounded-full bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors text-sm">
            <span class="dark:hidden">🌙</span><span class="hidden dark:inline">☀️</span>
        </button>
    </div>
</header>

<!-- MAIN -->
<main class="max-w-3xl mx-auto px-6 py-12">

    <!-- Title -->
    <div class="mb-8">
        <div class="flex flex-wrap gap-2 mb-4">
            <span class="px-3 py-1 text-xs font-semibold bg-orange-100 text-orange-700 rounded-full dark:bg-orange-900/30 dark:text-orange-300">Fusion (CAD)</span>
            <span class="px-3 py-1 text-xs font-semibold bg-blue-100 text-blue-700 rounded-full dark:bg-blue-900/30 dark:text-blue-300">Simulation</span>
            <span class="px-3 py-1 text-xs font-semibold bg-cyan-100 text-cyan-700 rounded-full dark:bg-cyan-900/30 dark:text-cyan-300">Materials</span>
        </div>
        <h1 class="text-4xl font-extrabold text-gray-900 dark:text-white mb-3">ESA SkyMed Demonstration Project</h1>
        <p class="text-gray-500 dark:text-gray-400 text-sm">Skyfarer Ltd · Jun 2025 – Mar 2026</p>
    </div>

    <!-- Image -->
    <div class="mb-10 rounded-2xl overflow-hidden border border-gray-200 dark:border-gray-700">
        <img
            src="skyfarer.jpg"
            alt="ESA SkyMed Demonstration Project"
            class="w-full h-auto block"
            onerror="this.parentElement.style.display='none'"
        />
    </div>

    <!-- Content placeholder -->
    <div class="prose prose-gray dark:prose-invert max-w-none text-gray-700 dark:text-gray-300 text-base leading-relaxed space-y-6">

        <p class="text-gray-400 dark:text-gray-500 italic">Content coming soon — check back later!</p>

    </div>

    <!-- Back link -->
    <div class="mt-12 pt-8 border-t border-gray-200 dark:border-gray-700">
        <a href="index.html" class="inline-flex items-center gap-2 text-sm font-semibold text-gray-600 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            Back
        </a>
    </div>

</main>

<script>
    const darkToggle = document.getElementById('darkToggle');
    const html = document.documentElement;
    function toggleDarkMode() {
        html.classList.toggle('dark');
        localStorage.setItem('darkMode', html.classList.contains('dark'));
    }
    darkToggle.addEventListener('click', toggleDarkMode);
    if (localStorage.getItem('darkMode') === 'true' ||
        (!('darkMode' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        html.classList.add('dark');
    }
</script>
</body>
</html>
